<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="header"></div>

<section class="hero-formulier">
      <img src="img/donatie-remove.png" alt="donatie-afbeelding" class="foto-donatie">
    <h2 class="intro-formulier">Vul hieronder uw donatiegegevens in</h2>
    






<div id="progress-container">
  <div id="progress-bar"></div>
</div>







<div class="formuliertje">
    <h1 id="weergave">€3500</h1>
    <form>
      <label>Volledige naam*
        <input type="text" required>
      </label>

      <label>Telefoonnummer*
        <input type="text" required>
      </label>

      <label>Email-adres*
        <input type="email" required>
      </label>

      <label>Reden voor donatie*
        <select required>
          <option value="">-- Kies een reden --</option>
          <option>Nagedachtenis overleden persoon</option>
          <option>Spontane actie</option>
          <option>Veel geleerd van website</option>
          <option>Persoonlijk verbonden aan doel</option>
          <option>Verjaardag actie</option>
          <option>Bedrijfssponsoring</option>
          <option>Periodieke gift</option>
        </select>
      </label>

      <label>Bankrekeningnummer (IBAN)
        <input type="text">
      </label>

      <label>Wijze van doneren</label>
      <input type="radio" name="wijze" value="storten"> Zelf storten<br>
      <input type="radio" name="wijze" value="incasso"> Incasso-opdracht

      <label>Bedrag van donatie (€)*  
        <input  id="donatie" type="number" step="0.01" required>
      </label>

      <div class="buttons">
        <button id="knop" type="submit" class="button-formulier1">Verzenden</button>
        <button type="reset" class="button-formulier2">Annuleren</button>
      </div>
    </form>
    </div>
       <div class="shape-lijntje"></div>
      <div class="vlak-doorzichtig"></div>
  </section>


    <div id="footer-container"></div>
</body>
</html>
